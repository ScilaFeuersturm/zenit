services:
  - type: web
    name: zenit-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./zenitapp/backend/Dockerfile
    dockerContext: ./zenitapp/backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: zenit-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        value: admin@eventoszenit.com
      - key: FIRST_ADMIN_PASSWORD
        generateValue: true
  - type: web
    name: zenit-app
    runtime: static
    rootDir: zenitapp/frontend
    buildCommand: npm ci --no-audit --no-fund && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: zenit-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  - type: web
    name: zenit-web
    runtime: static
    rootDir: zenitapp/landing
    buildCommand: node build.cjs
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: API_URL
        fromService:
          name: zenit-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_URL
        fromService:
          name: zenit-app
          type: web
          envVarKey: RENDER_EXTERNAL_URL
databases:
  - name: zenit-db
    plan: free
    region: virginia
    databaseName: zenit
    user: zenit
    ipAllowList: []
